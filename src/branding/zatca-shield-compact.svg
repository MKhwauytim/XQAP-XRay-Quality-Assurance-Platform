<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ZATCA X-ray quality shield mark">
  <!-- Compact mark: fewer, thicker diagonal stripes so the shield still reads clearly at 16-32px favicon sizes. -->
  <defs>
    <linearGradient id="shieldGradient" gradientUnits="userSpaceOnUse" x1="96" y1="480" x2="416" y2="64">
      <stop offset="0%" stop-color="#29A3D3" />
      <stop offset="50%" stop-color="#3FB6AE" />
      <stop offset="100%" stop-color="#5CB947" />
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M96 64 L416 64 L416 280 C416 380 350 440 256 480 C162 440 96 380 96 280 Z" />
    </clipPath>
  </defs>
  <g clip-path="url(#shieldClip)">
    <g stroke="url(#shieldGradient)" stroke-width="30" stroke-linecap="butt">
    <line x1="-980" y1="420" x2="420" y2="-980" />
    <line x1="-918" y1="482" x2="482" y2="-918" />
    <line x1="-856" y1="544" x2="544" y2="-856" />
